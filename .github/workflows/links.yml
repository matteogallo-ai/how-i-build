name: links

on:
  push:
  schedule:
    # Mondays: a linked PR or file can disappear without any push here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every linked PR, commit and file exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-links.sh
      - name: The link check itself fails on a missing pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/test-check-links.sh
